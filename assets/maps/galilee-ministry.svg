<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1170" width="1100" height="1170" role="img" aria-labelledby="map-title map-description" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif"><title id="map-title">Jesus’ Ministry in Galilee | 耶稣在加利利的事工</title><desc id="map-description">Selected Gospel places: Nazareth, disputed Cana, and Capernaum. Points are approximate; this is not a chronological itinerary. Cana has competing identifications. / 选定拿撒勒、迦拿与迦百农；地点为示意，不表示按时间排列的行程。迦拿的位置有争议。</desc><rect width="1100" height="1170" fill="#fbfaf6" /><text x="40.00" y="43.00" font-size="27" font-weight="bold" fill="#263b38">Jesus’ Ministry in Galilee | 耶稣在加利利的事工</text><text x="40.00" y="77.00" font-size="18" fill="#263b38">Draft · Approximate / 草稿 · 示意</text><text x="40.00" y="118.00" font-size="22" fill="#263b38">Selected places, not a reconstructed itinerary / 选定地点，不重建完整行程</text><rect x="249.49743925029406" y="155.0" width="601.0051214994119" height="520.0" fill="#dfedf0" stroke="#b9c5be" /><path d="M286.32,675.00 L309.51,564.33 L334.50,392.65 L342.64,388.10 L373.89,397.70 L395.42,371.55 L402.26,346.21 L394.53,335.00 L401.64,285.75 L409.11,241.00 L416.94,232.51 L413.20,219.18 L439.43,193.79 L450.46,174.40 L447.17,169.98 L454.19,174.40 L463.18,155.00 L850.50,155.00 L850.50,675.00 Z" fill="#f2eee1" stroke="#718077" stroke-width="0.7" fill-rule="evenodd" /><path d="M707.16,366.26 L705.23,446.04 L686.25,468.43 L674.03,466.90 L668.23,442.98 L641.37,401.46 L644.92,381.18 L661.96,362.62 L693.97,352.67 L707.16,366.26 Z" fill="#dfedf0" stroke="#718077" stroke-width="0.7" fill-rule="evenodd" /><circle cx="673.02" cy="362.61" r="4" fill="#263b38" stroke="#ffffff" stroke-width="1.4" /><line x1="673.02" y1="362.61" x2="683.02" y2="358.61" stroke="#7b8880" stroke-width="0.8" /><text x="683.02" y="358.61" font-size="24" stroke="#fbfaf6" stroke-width="3" paint-order="stroke" fill="#263b38">Capernaum</text><text x="683.02" y="385.61" font-size="24" stroke="#fbfaf6" stroke-width="3" paint-order="stroke" fill="#263b38">迦百农</text><circle cx="523.52" cy="475.62" r="4" fill="#263b38" stroke="#ffffff" stroke-width="1.4" /><line x1="523.52" y1="475.62" x2="533.52" y2="471.62" stroke="#7b8880" stroke-width="0.8" /><text x="533.52" y="471.62" font-size="24" stroke="#fbfaf6" stroke-width="3" paint-order="stroke" fill="#263b38">Nazareth</text><text x="533.52" y="498.62" font-size="24" stroke="#fbfaf6" stroke-width="3" paint-order="stroke" fill="#263b38">拿撒勒</text><circle cx="543.87" cy="449.44" r="4" fill="#263b38" stroke="#ffffff" stroke-width="1.4" /><line x1="543.87" y1="449.44" x2="553.87" y2="407.44" stroke="#7b8880" stroke-width="0.8" /><text x="553.87" y="407.44" font-size="24" stroke="#fbfaf6" stroke-width="3" paint-order="stroke" fill="#263b38">Cana?</text><text x="553.87" y="434.44" font-size="24" stroke="#fbfaf6" stroke-width="3" paint-order="stroke" fill="#263b38">迦拿？</text><text x="741.23" y="467.00" font-size="19" fill="#263b38">Sea of Galilee</text><text x="741.23" y="492.00" font-size="19" fill="#263b38">加利利海</text><line x1="70" y1="725" x2="186.91173164260923" y2="725" stroke="#263b38" stroke-width="3" /><line x1="70" y1="720" x2="70" y2="730" stroke="#263b38" stroke-width="2" /><line x1="186.91173164260923" y1="720" x2="186.91173164260923" y2="730" stroke="#263b38" stroke-width="2" /><text x="70.00" y="749.00" font-size="15" fill="#263b38">20 km · at 32.8°N / 按中纬度</text><line x1="261.9117316426092" y1="731" x2="261.9117316426092" y2="697" stroke="#263b38" stroke-width="2" /><polygon points="261.9117316426092,685 255.9117316426092,699 267.9117316426092,699" fill="#263b38" /><text x="271.91" y="701.00" font-size="17" fill="#263b38">N 北</text><text x="40.00" y="800.00" font-size="22" fill="#263b38">Nazareth: Luke 4:16–30</text><text x="40.00" y="827.00" font-size="22" fill="#263b38">拿撒勒：路加福音4:16–30</text><text x="40.00" y="861.00" font-size="22" fill="#263b38">Cana?: John 2:1–11; 4:46–54</text><text x="40.00" y="888.00" font-size="22" fill="#263b38">迦拿？：约翰福音2:1–11；4:46–54</text><text x="40.00" y="922.00" font-size="22" fill="#263b38">Capernaum: Mark 1:21–39</text><text x="40.00" y="949.00" font-size="22" fill="#263b38">迦百农：马可福音1:21–39</text><text x="40.00" y="1000.00" font-size="21" fill="#263b38">Cana is disputed: the legacy point is near Kefr Kenna.</text><text x="40.00" y="1028.00" font-size="21" fill="#263b38">Other candidates include Horbat Qana and Ain Qana; see the source notes.</text><text x="40.00" y="1056.00" font-size="20" fill="#263b38">迦拿有争议：旧数据代表点在Kefr Kenna附近；其他候选包括Horbat Qana与Ain Qana。</text><text x="40.00" y="1108.00" font-size="18" fill="#263b38">Made with Natural Earth · OpenBible.info legacy points (CC BY 4.0)</text><text x="40.00" y="1138.00" font-size="18" fill="#263b38">Modern physical outlines; original labels and layout / 现代自然轮廓；原创双语标注与版面</text></svg>
