<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1600" width="1100" height="1600" role="img" aria-labelledby="map-title map-description" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif"><title id="map-title">The Bible Story in One Page | 一页圣经故事线</title><desc id="map-description">Ten bilingual story stages with approximate narrative periods, disputed ranges and undated beginning/future hope. Vertical order is narrative, not a proportional timescale. / 十站双语故事线；区分叙事年代、争议区间与不可定年的开端和盼望。</desc><rect width="1100" height="1600" fill="#fbfaf6" /><text x="40.00" y="43.00" font-size="27" font-weight="bold" fill="#263b38">The Bible Story in One Page | 一页圣经故事线</text><text x="40.00" y="77.00" font-size="18" fill="#263b38">Draft · Approximate / 草稿 · 示意</text><text x="40.00" y="110.00" font-size="20" fill="#263b38">Narrative order, not a proportional timescale / 叙事顺序，不按时间比例</text><line x1="77" y1="170" x2="77" y2="1420" stroke="#456346" stroke-width="4" /><circle cx="77" cy="190" r="24" fill="#456346" /><text x="77.00" y="198.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text><rect x="125" y="150" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="181.00" font-size="24" font-weight="bold" fill="#263b38">Creation | 创造</text><text x="145.00" y="212.00" font-size="18" fill="#263b38">Primeval narrative; no agreed historical date</text><text x="145.00" y="241.00" font-size="18" fill="#263b38">太古叙事；没有公认历史定年</text><circle cx="77" cy="318" r="24" fill="#456346" /><text x="77.00" y="326.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text><rect x="125" y="278" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="309.00" font-size="24" font-weight="bold" fill="#263b38">Fall | 堕落</text><text x="145.00" y="340.00" font-size="18" fill="#263b38">Primeval narrative; no agreed historical date</text><text x="145.00" y="369.00" font-size="18" fill="#263b38">太古叙事；没有公认历史定年</text><circle cx="77" cy="446" r="24" fill="#456346" /><text x="77.00" y="454.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text><rect x="125" y="406" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="437.00" font-size="24" font-weight="bold" fill="#263b38">Covenant with Abraham | 与亚伯拉罕立约</text><text x="145.00" y="468.00" font-size="18" fill="#263b38">c.2000–1600 BCE? Traditional narrative setting; disputed</text><text x="145.00" y="497.00" font-size="18" fill="#263b38">约前2000–1600年？传统叙事背景，有争议</text><circle cx="77" cy="574" r="24" fill="#456346" /><text x="77.00" y="582.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text><rect x="125" y="534" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="565.00" font-size="24" font-weight="bold" fill="#263b38">Exodus and law | 出埃及与律法</text><text x="145.00" y="596.00" font-size="18" fill="#263b38">15th or 13th century BCE models; event date unresolved</text><text x="145.00" y="625.00" font-size="18" fill="#263b38">前十五或十三世纪模型；事件年代未定</text><circle cx="77" cy="702" r="24" fill="#456346" /><text x="77.00" y="710.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text><rect x="125" y="662" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="693.00" font-size="24" font-weight="bold" fill="#263b38">Kingdom and division | 王国与分裂</text><text x="145.00" y="724.00" font-size="18" fill="#263b38">c.1050–586 BCE; early chronology debated</text><text x="145.00" y="753.00" font-size="18" fill="#263b38">约前1050–586年；早期年代有争议</text><circle cx="77" cy="830" r="24" fill="#456346" /><text x="77.00" y="838.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text><rect x="125" y="790" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="821.00" font-size="24" font-weight="bold" fill="#263b38">Exile and return | 被掳与归回</text><text x="145.00" y="852.00" font-size="18" fill="#263b38">c.722–400 BCE; several deportations and returns</text><text x="145.00" y="881.00" font-size="18" fill="#263b38">约前722–400年；包含多次迁徙与归回</text><circle cx="77" cy="958" r="24" fill="#456346" /><text x="77.00" y="966.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text><rect x="125" y="918" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="949.00" font-size="24" font-weight="bold" fill="#263b38">Between the Testaments | 两约之间</text><text x="145.00" y="980.00" font-size="18" fill="#263b38">c.400 BCE–1 CE; period labels overlap</text><text x="145.00" y="1009.00" font-size="18" fill="#263b38">约前400年至公元1年；分期有重叠</text><circle cx="77" cy="1086" r="24" fill="#456346" /><text x="77.00" y="1094.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text><rect x="125" y="1046" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="1077.00" font-size="24" font-weight="bold" fill="#263b38">Jesus | 耶稣</text><text x="145.00" y="1108.00" font-size="18" fill="#263b38">Birth c.6–4 BCE; death c.30–33 CE; ranges debated</text><text x="145.00" y="1137.00" font-size="18" fill="#263b38">诞生约前6–4年；受死约公元30–33年，区间有争议</text><circle cx="77" cy="1214" r="24" fill="#456346" /><text x="77.00" y="1222.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text><rect x="125" y="1174" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="1205.00" font-size="24" font-weight="bold" fill="#263b38">Church | 教会</text><text x="145.00" y="1236.00" font-size="18" fill="#263b38">c.30 CE onward; early dates approximate</text><text x="145.00" y="1265.00" font-size="18" fill="#263b38">约公元30年起；早期年代为大致估计</text><circle cx="77" cy="1342" r="24" fill="#456346" /><text x="77.00" y="1350.00" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold">10</text><rect x="125" y="1302" width="925" height="111" rx="10" fill="#eaf0e5" stroke="#c4cebd" /><text x="145.00" y="1333.00" font-size="24" font-weight="bold" fill="#263b38">New creation | 新创造</text><text x="145.00" y="1364.00" font-size="18" fill="#263b38">Future hope; not assigned a calendar date</text><text x="145.00" y="1393.00" font-size="18" fill="#263b38">将来的盼望；不设公历日期</text><text x="40.00" y="1490.00" font-size="17" fill="#263b38">Dates summarize this library's draft guides; early periods are not independently fixed. / 年代为草稿导读概览，早期无法独立定年。</text><text x="40.00" y="1522.00" font-size="18" fill="#263b38">Creation/fall and new creation are not assigned calendar dates. / 创造、堕落与新创造不设公历日期。</text><text x="40.00" y="1554.00" font-size="18" fill="#263b38">Read passages before summaries; see First Steps and the source notes. / 先读经文，再读概览与来源说明。</text></svg>
