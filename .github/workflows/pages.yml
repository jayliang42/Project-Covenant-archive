name: Build and deploy reading site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out committed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and local media
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit_markdown.py
          python3 scripts/audit_publication.py
          python3 scripts/audit_publication.py --history-content
          python3 scripts/generate_maps.py --check
          python3 scripts/prepare_illustrations.py --check
          git diff --check

      - name: Export, build, and independently verify
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir="$RUNNER_TEMP/covenant-pages-snapshot"
          site_dir="$RUNNER_TEMP/covenant-pages-site"
          export_log="$RUNNER_TEMP/covenant-pages-export.log"
          python3 scripts/export_publication.py export --ref HEAD --output "$snapshot_dir" | tee "$export_log"
          content_digest="$(awk -F= '$1 == "publication_content_set_sha256" {print $2}' "$export_log")"
          test "${#content_digest}" -eq 64
          python3 scripts/export_publication.py verify --input "$snapshot_dir" --expected-content-set-sha256 "$content_digest"
          python3 scripts/build_static_site.py build --snapshot "$snapshot_dir" --expected-content-set-sha256 "$content_digest" --output "$site_dir"
          python3 scripts/build_static_site.py verify --snapshot "$snapshot_dir" --expected-content-set-sha256 "$content_digest" --input "$site_dir"

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/covenant-pages-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
