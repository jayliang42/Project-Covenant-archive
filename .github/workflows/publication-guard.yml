name: Publication Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Audit public content
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run publication guard tests
        run: python3 -m unittest discover -s tests -v

      - name: Check reproducible local media
        run: |
          python3 scripts/generate_maps.py --check
          python3 scripts/prepare_illustrations.py --check

      - name: Audit Markdown structure
        run: python3 scripts/audit_markdown.py

      - name: Audit privacy and website allowlist
        run: python3 scripts/audit_publication.py

      - name: Audit historical content
        run: python3 scripts/audit_publication.py --history-content

      - name: Export, build, and verify clean publication artifacts
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/project-covenant-public"
          site_dir="$RUNNER_TEMP/project-covenant-site"
          offline_zip="$RUNNER_TEMP/project-covenant-offline.zip"
          export_log="$RUNNER_TEMP/project-covenant-export.log"
          python3 scripts/export_publication.py export --ref HEAD --output "$output_dir" | tee "$export_log"
          digest="$(awk -F= '$1 == "publication_content_set_sha256" { print $2 }' "$export_log")"
          test "${#digest}" -eq 64
          python3 scripts/export_publication.py verify --input "$output_dir" --expected-content-set-sha256 "$digest"
          python3 scripts/build_static_site.py build --snapshot "$output_dir" --expected-content-set-sha256 "$digest" --output "$site_dir"
          python3 scripts/build_static_site.py verify --snapshot "$output_dir" --expected-content-set-sha256 "$digest" --input "$site_dir"
          python3 scripts/package_offline_site.py create --snapshot "$output_dir" --expected-content-set-sha256 "$digest" --output "$offline_zip"
          python3 scripts/package_offline_site.py verify --snapshot "$output_dir" --expected-content-set-sha256 "$digest" --input "$offline_zip"

      - name: Install browser test dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/covenant-browser-venv"
          "$RUNNER_TEMP/covenant-browser-venv/bin/pip" install 'playwright==1.57.0'
          "$RUNNER_TEMP/covenant-browser-venv/bin/python" -m playwright install --with-deps chromium

      - name: Check every reading page in Chromium
        id: reader_browser
        shell: bash
        run: |
          "$RUNNER_TEMP/covenant-browser-venv/bin/python" scripts/check_reader_browser.py \
            --site "$RUNNER_TEMP/project-covenant-site" \
            --output "$RUNNER_TEMP/covenant-browser-review"

      - name: Upload browser review
        if: ${{ !cancelled() && steps.reader_browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: covenant-browser-review
          path: ${{ runner.temp }}/covenant-browser-review
          if-no-files-found: warn
          retention-days: 7

      - name: Reject whitespace errors
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD

      - name: Upload verified reading preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: covenant-reading-preview
          path: ${{ runner.temp }}/project-covenant-offline.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
